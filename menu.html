<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración de caracteres -->
    <meta charset="UTF-8">

    <!-- Adaptación para PC, tablet y celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título de la página -->
    <title>La Aventura de Facundo</title>

    <!-- Conexión con el archivo CSS -->
    <link rel="stylesheet" href="menu.css">
</head>

<body>

    <!-- =========================================
         PANTALLA PRINCIPAL
         ========================================= -->

    <main class="pantalla">

        <!-- =========================================
             LOGO DEL VIDEOJUEGO
             ========================================= -->

        <img 
            src="../Recursos Graficos/logo la aventura de facundo.png"
            alt="La Aventura de Facundo"
            class="logo"
        >


        <!-- =========================================
             MENÚ PRINCIPAL
             ========================================= -->

        <div class="menu">

            <!-- Botón JUGAR -->
            <button class="boton" onclick="jugar()">
                <img 
                    src="../Recursos Graficos/boton jugar.png"
                    alt="Jugar"
                >
            </button>

            <!-- Botón OPCIONES -->
            <button class="boton" onclick="opciones()">
                <img 
                    src="../Recursos Graficos/boton opciones.png"
                    alt="Opciones"
                >
            </button>

            <!-- Botón CRÉDITOS -->
            <button class="boton" onclick="creditos()">
                <img 
                    src="../Recursos Graficos/boton creditos.png"
                    alt="Créditos"
                >
            </button>

        </div>

    </main>


    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script>

        // Función que se ejecuta al presionar JUGAR
        function jugar() {
            alert("¡Comenzando la aventura!");
        }

        // Función que se ejecuta al presionar OPCIONES
        function opciones() {
            alert("Opciones del juego");
        }

        // Función que se ejecuta al presionar CRÉDITOS
        function creditos() {
            alert("La Aventura de Facundo");
        }

    </script>

</body>

</html>
